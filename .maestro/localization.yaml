appId: com.hasanbuilds.prayertime
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Language, English"
    direction: DOWN
- tapOn: "Language, English"
- tapOn: "বাংলা"
- assertVisible: "সেটিংস"
- scrollUntilVisible:
    element: "সংরক্ষিত রেকর্ড"
    direction: UP
- tapOn: "সংরক্ষিত রেকর্ড"
- assertVisible: "রেকর্ড রপ্তানি করুন"
- tapOn: "সংরক্ষিত রেকর্ড বন্ধ করুন"
- scrollUntilVisible:
    element: "ভাষা, বাংলা"
    direction: DOWN
- tapOn: "ভাষা, বাংলা"
- tapOn: "العربية"
- assertVisible: "الإعدادات"
- scrollUntilVisible:
    element: "السجلات المحفوظة"
    direction: UP
- tapOn: "السجلات المحفوظة"
- assertVisible: "تصدير السجلات"
- tapOn: "إغلاق السجلات المحفوظة"
- scrollUntilVisible:
    element: "اللغة, العربية"
    direction: DOWN
- tapOn: "اللغة, العربية"
- tapOn: "English"
- assertVisible: "Settings"
- tapOn: "Back"
