appId: com.hasanbuilds.prayertime
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- tapOn: "Tasbeeh"
- tapOn: "Add one to General, .*"
- assertVisible:
    id: "tasbeeh-count"
    text: "1"
- tapOn: "Prayer"
- tapOn:
    id: "journal-check-fajr"
- assertVisible:
    id: "journal-check-fajr"
    checked: true
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Time format, 12-hour"
    direction: DOWN
- tapOn: "Time format, 12-hour"
- tapOn: "Close Time format"
- tapOn: "Time format, 12-hour"
- tapOn: "24-hour"
- assertVisible: "Time format, 24-hour"
- scrollUntilVisible:
    element: "Appearance, Light"
    direction: UP
- tapOn: "Appearance, Light"
- assertNotVisible: "Sage"
- tapOn: "Light"
- tapOn: "Back"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- assertVisible:
    id: "journal-check-fajr"
    checked: true
- tapOn: "Tasbeeh"
- assertVisible:
    id: "tasbeeh-count"
    text: "1"
