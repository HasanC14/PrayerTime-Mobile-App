name: Feature request
description: Propose an improvement to PrayerTime.
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how users would interact with the feature and any simpler alternatives.
    validations:
      required: true
