name: Bug report
description: Report a reproducible problem with PrayerTime.
body:
  - type: markdown
    attributes:
      value: Please use sample data. Do not post private journal records, exact coordinates, or credentials. See SECURITY.md for sensitive reports.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version or commit, phone/emulator model, OS version, language, and native build or web/Expo Go.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Optional. Remove private data before sharing.
