name: Native builds and smoke test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compile app and local native modules
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install pinned Maestro CLI
        run: |
          curl -fL --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Start Metro
        run: |
          npx expo start --localhost --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          python3 scripts/wait-for-metro.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native persistence and settings smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-port: 5554
          disable-animations: true
          script: |
            adb reverse tcp:8081 tcp:8081
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/seed-emulator.py
            adb shell appops set com.hasanbuilds.prayertime SCHEDULE_EXACT_ALARM allow
            python3 scripts/render-widgets.py --device emulator-5554
            maestro test --format junit --output native-test-results.xml .maestro/
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-failure
          if-no-files-found: ignore
          path: |
            native-test-results.xml
            review/widget-refinement/native
            ~/.maestro/tests
            ${{ runner.temp }}/metro.log
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate app and widget extension, install Pods
        run: npx expo prebuild --platform ios
      - name: Compile unsigned iOS app and widget extension
        run: >-
          xcodebuild -workspace ios/PrayerTime.xcworkspace -scheme PrayerTime
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/prayertime-ios"
          CODE_SIGNING_ALLOWED=NO build
