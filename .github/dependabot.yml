version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      expo:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - babel-preset-expo
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
